name: Detektorius

# Trys pamainos per darbo diena (UTC). Kiekviena pamaina (ciklas.py) pati
# suka rata kas 5 min iki savo ribos: 11:30, 16:15, 21:05 UTC.
# Anksciau "*/5" GitHub planuoklis realiai paleisdavo kas 10-20 min.
# Kita pamaina startuoja pries baigiantis ankstesnei ir laukia eileje
# (concurrency), todel 5 min ritmas nutruksta tik pamainu sanduroje.
on:
  schedule:
    - cron: "45 6 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "58 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: detektorius
  cancel-in-progress: false

jobs:
  aptikti:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy tzdata

      - name: Patikrinti failus
        run: |
          for f in detektorius.py universas.py ciklas.py; do
            test -f "$f" || (echo "KLAIDA - $f nerastas" && exit 1)
          done

      - name: Git tapatybe
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Ciklo savitikra (laikai, git pull/push, sugedusio kodo praleidimas).
      # Detektoriaus savitikra ciklas paleidzia PRIES KIEKVIENA rata.
      - name: Savitikra - ciklas
        run: python ciklas.py --savitikra

      # Kiekvienas ratas: git pull -> savitikra -> detektorius --live (nauji
      # yahoo duomenys, atskiras procesas) -> commit + push.
      - name: Detektorius kas 5 min
        run: python ciklas.py
