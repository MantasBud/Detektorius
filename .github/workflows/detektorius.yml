name: Detektorius

on:
  schedule:
    # EU sesija 09:00-17:30 Berlyno = 07:00-15:30 UTC
    # JAV sesija 09:30-16:00 Niujorko = 14:30-21:00 UTC
    - cron: "*/5 7-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: detektorius
  cancel-in-progress: false

jobs:
  aptikti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy tzdata

      - name: Patikrinti failus
        run: |
          test -f detektorius.py || (echo "KLAIDA - detektorius.py nerastas" && exit 1)
          test -f universas.py  || (echo "KLAIDA - universas.py nerastas"  && exit 1)

      - name: Savitikra
        run: python detektorius.py --savitikra

      - name: Aptikti scenarijus (EU + JAV)
        run: python detektorius.py --live --rinka abi

      - name: Irasyti pakeitimus
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs busena.json
          git diff --cached --quiet || (git commit -m "Detektorius" && git push)
