name: Universo atranka

# Paleidziama RANKOMIS. Nieko neperrasо ir nieko nekomituoja - tik patikrina
# kandidatus tikrais duomenimis ir atiduoda rezultata kaip artefakta.
# Sprendima, ka pridèti i universas.py, priima Mantas, ne sis workflow.

on:
  workflow_dispatch:
    inputs:
      rinka:
        description: "eu arba us"
        required: true
        default: "us"
      saltinis:
        description: "kandidatai.txt (failas repo saknyje) arba 'esami' dabartinio universo auditui"
        required: true
        default: "kandidatai.txt"

jobs:
  atranka:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy tzdata

      # Savitikra pirma: atranka naudoja detektoriaus ribas (min_atr_pct,
      # min_apyvarta), tad jei detektorius pagedes, atranka atrinktu pagal
      # sugedusias ribas ir to nesimatytu.
      - name: Savitikra
        run: python detektorius.py --savitikra

      - name: Atranka
        run: |
          if [ "${{ github.event.inputs.saltinis }}" = "esami" ]; then
            python atranka_universas.py --rinka "${{ github.event.inputs.rinka }}" \
              --tik-esamus --out tinkami.txt | tee atranka.txt
          else
            test -f "${{ github.event.inputs.saltinis }}" || \
              (echo "KLAIDA: kandidatu failo nera" && exit 1)
            python atranka_universas.py --rinka "${{ github.event.inputs.rinka }}" \
              --failas "${{ github.event.inputs.saltinis }}" --out tinkami.txt | tee atranka.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: atranka-${{ github.event.inputs.rinka }}
          path: |
            atranka.txt
            tinkami.txt
