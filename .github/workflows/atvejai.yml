name: Atveju tyrimas

on:
  workflow_dispatch: {}

jobs:
  tirti:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy tzdata

      - name: Patikrinti failus
        run: |
          test -f detektorius.py || (echo "KLAIDA - detektorius.py nerastas" && exit 1)
          test -f atvejai.py    || (echo "KLAIDA - atvejai.py nerastas"    && exit 1)

      - name: Atveju tyrimas
        run: python atvejai.py | tee atvejai.txt

      - uses: actions/upload-artifact@v4
        with:
          name: atvejai
          path: atvejai.txt
