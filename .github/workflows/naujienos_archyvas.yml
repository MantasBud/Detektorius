name: EODHD naujienos (archyvas ir padengimas)

# EODHD plano 3 zingsnis. Naujienos nuo 2020-10 visam universui
# (EU: biržos simbolis + .F; JAV: .US). EU ir JAV - du lygiagretus darbai.
# Raktas is GitHub Secret EODHD_TOKEN, niekur nespausdinamas. Repo failu nekeicia.

on:
  workflow_dispatch:
    inputs:
      tik:
        description: "Bandymui: kiek akciju is rinkos + pavyzdines (tuscia = visos, tada ir Release)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  naujienos:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        rinka: [eu, us]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas numpy

      - name: Savitikra
        run: python naujienos_archyvas.py --savitikra

      - name: Parsisiuntimas
        env:
          EODHD_TOKEN: ${{ secrets.EODHD_TOKEN }}
          TIK: ${{ github.event.inputs.tik }}
        run: |
          if [ -n "$TIK" ]; then python naujienos_archyvas.py --rinka ${{ matrix.rinka }} --tik "$TIK"; else python naujienos_archyvas.py --rinka ${{ matrix.rinka }}; fi

      - name: Supakavimas
        if: always()
        run: |
          tar -cf eodhd_naujienos_${{ matrix.rinka }}.tar naujienos || true
          ls -lh eodhd_naujienos_*.tar

      - name: Release
        if: ${{ always() && github.event.inputs.tik == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "naujienos-${{ matrix.rinka }}-${{ github.run_number }}" eodhd_naujienos_${{ matrix.rinka }}.tar \
            --title "EODHD naujienos ${{ matrix.rinka }} $(date -u +%Y-%m-%d)" \
            --notes "Naujienos nuo 2020-10 (EODHD). Formatas: naujienos/<tikeris>.jsonl.gz."
