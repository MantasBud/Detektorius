name: Zymu patikra (atpazinimas)

# Ar zyma padeda atskirti TIKRA scenariju nuo panasaus.
# Tikras = 1 scenarijus pasiekia korteles tiksla anksciau nei stop'a;
#          2 scenarijus baigiasi pelnu.
# Nieko nefiltruoja ir nieko nekomituoja. detektorius.py nelieciamas.

on:
  workflow_dispatch: {}

jobs:
  zymos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy tzdata

      - name: Patikrinti failus
        run: |
          for f in detektorius.py zymos.py universas.py; do
            test -f "$f" || (echo "KLAIDA - $f nerastas" && exit 1)
          done

      - name: Savitikra - detektorius
        run: python detektorius.py --savitikra

      - name: Savitikra - zymos
        run: python zymos.py --savitikra

      - name: Zymu patikra
        run: python zymos.py | tee zymos.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zymos
          path: zymos.txt
